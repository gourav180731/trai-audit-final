# Server
server.port=8081
spring.application.name=TRAI SMS Dissemination Audit System

# ------------------------------------------------------------------
# Datasource — your existing local PostgreSQL 18 (NOT docker-compose)
# Default points to your dedicated trai_audit DB on localhost:5432.
# docker-compose.yml is kept for CI/other envs but is NOT the active
# datasource for local runs — it is not started unless you explicitly
# run `docker compose up`. Override via env vars if needed.
# User confirmed: host=localhost, port=5432, db=trai_audit,
# username=postgres, password=<empty/trust> via pgAdmin.
# ------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trai_audit}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# JPA — validate against Flyway-managed dm schema; app tables auto-create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — manages dm schema (migrations in db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dm,public
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

# H2 Console — disable in production (only useful when SPRING_DATASOURCE_URL points to H2 for local tests)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File upload (legacy fallback removed — kept only for TRAI baseline upload if needed)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail — externalized, never hardcoded (see NEEDS_SIGN_OFF.md)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# From address used for all report emails
audit.mail.from=${AUDIT_MAIL_FROM:noreply@cap-sachet.gov.in}
audit.mail.from-name=${AUDIT_MAIL_FROM_NAME:CAP Sachet Audit System}

# Logging
logging.level.root=INFO
logging.level.com.audit=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ------------------------------------------------------------------
# Audit thresholds — single source of truth (AuditProperties.java)
# ------------------------------------------------------------------
audit.threshold.feedback-delay-seconds=600
audit.threshold.subscriber-ratio-deviation-pct=15.0
audit.threshold.recency-window-hours=24
# MRAD matrix bands (minutes) — 0-5k, 5-15k, 15-30k; >30k = beyond matrix
audit.mrad.band-0-5k-minutes=60
audit.mrad.band-5-15k-minutes=90
audit.mrad.band-15-30k-minutes=120

# Report
audit.report.preview-row-limit=100
