# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=TRAI SMS Dissemination Audit System

# H2 Database Configuration (file-based, persisted)
spring.datasource.url=jdbc:h2:file:./data/trai_audit_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (for debugging - disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration (for Excel file uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.audit=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Application-specific configuration
# Discrepancy Detection Thresholds (see README - NEEDS_SIGN_OFF section)
audit.threshold.feedback-delay-seconds=600
audit.threshold.subscriber-ratio-deviation-pct=15.0
audit.threshold.recency-window-hours=24
