<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${discrepancyType} + ' - TRAI Audit'">Category Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-exclamation-triangle text-warning"></i> <span th:text="${discrepancyType}">Category</span></h2>
                <p class="text-muted">Total records: <strong th:text="${#lists.size(records)}">0</strong></p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Discrepancy Records</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Alert ID</th>
                                        <th>TSP</th>
                                        <th>State</th>
                                        <th>Event</th>
                                        <th>Actual Value</th>
                                        <th>Expected Value</th>
                                        <th>Deviation</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(records)}">
                                        <td colspan="9" class="text-center text-muted">No discrepancies found for this category</td>
                                    </tr>
                                    <tr th:each="record : ${records}">
                                        <td>
                                            <a th:href="@{/alert/{id}(id=${record.alertId})}" th:text="${record.alertId}">Alert ID</a>
                                        </td>
                                        <td th:text="${record.tsp}">TSP</td>
                                        <td th:text="${record.state}">State</td>
                                        <td th:text="${record.event}">Event</td>
                                        <td th:text="${record.actualValue}">Actual</td>
                                        <td th:text="${record.expectedValue}">Expected</td>
                                        <td th:text="${record.deviation}">Deviation</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${record.status == 'OPEN' ? 'bg-danger' : 
                                                                   record.status == 'ACKNOWLEDGED' ? 'bg-warning' : 
                                                                   record.status == 'RESOLVED' ? 'bg-success' : 'bg-secondary'}"
                                                  th:text="${record.status}">Status</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/discrepancy/{id}(id=${record.id})}" class="btn btn-sm btn-primary">
                                                <i class="fas fa-eye"></i> View
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
