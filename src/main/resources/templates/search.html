<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - TRAI Audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
            <span class="navbar-text text-white">
                <i class="fas fa-search"></i> Search & Filter
            </span>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-filter"></i> Search Filters</h5>
                    </div>
                    <div class="card-body">
                        <form method="post" th:action="@{/search}">
                            <div class="mb-3">
                                <label for="alertId" class="form-label">Alert ID</label>
                                <input type="text" class="form-control" id="alertId" name="alertId" 
                                       placeholder="Enter Alert ID" th:value="${criteria?.alertId}">
                            </div>

                            <div class="mb-3">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="startDate" name="startDate">
                            </div>

                            <div class="mb-3">
                                <label for="endDate" class="form-label">End Date</label>
                                <input type="date" class="form-control" id="endDate" name="endDate">
                            </div>

                            <div class="mb-3">
                                <label for="tsp" class="form-label">TSP</label>
                                <select class="form-select" id="tsp" name="tsp">
                                    <option value="">All TSPs</option>
                                    <option th:each="tsp : ${tsps}" th:value="${tsp}" th:text="${tsp}"
                                            th:selected="${criteria?.tsp == tsp}">TSP</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="discrepancyType" class="form-label">Discrepancy Type</label>
                                <select class="form-select" id="discrepancyType" name="discrepancyType">
                                    <option value="">All Types</option>
                                    <option th:each="type : ${discrepancyTypes}" th:value="${type}" th:text="${type}"
                                            th:selected="${criteria?.discrepancyType == type}">Type</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" name="state" 
                                       placeholder="Enter State" th:value="${criteria?.state}">
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="">All Statuses</option>
                                    <option th:each="stat : ${statuses}" th:value="${stat}" th:text="${stat}"
                                            th:selected="${criteria?.status == stat}">Status</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Cell Count Range</label>
                                <div class="input-group mb-2">
                                    <span class="input-group-text">Min</span>
                                    <input type="number" class="form-control" name="minCellCount" 
                                           placeholder="Min" th:value="${criteria?.minCellCount}">
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text">Max</span>
                                    <input type="number" class="form-control" name="maxCellCount" 
                                           placeholder="Max" th:value="${criteria?.maxCellCount}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Subscriber Count Range</label>
                                <div class="input-group mb-2">
                                    <span class="input-group-text">Min</span>
                                    <input type="number" class="form-control" name="minSubscriberCount" 
                                           placeholder="Min" th:value="${criteria?.minSubscriberCount}">
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text">Max</span>
                                    <input type="number" class="form-control" name="maxSubscriberCount" 
                                           placeholder="Max" th:value="${criteria?.maxSubscriberCount}">
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> Search
                                </button>
                                <a href="/search" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Clear
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-list"></i> Search Results
                            <span th:if="${searchPerformed}" class="badge bg-light text-dark float-end" 
                                  th:text="${resultCount} + ' records found'">Results</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${!searchPerformed}" class="text-center text-muted py-5">
                            <i class="fas fa-search fa-3x mb-3"></i>
                            <p>Use the filters on the left to search for discrepancies</p>
                        </div>

                        <div th:if="${searchPerformed and #lists.isEmpty(results)}" class="alert alert-info">
                            <i class="fas fa-info-circle"></i> No records found matching your search criteria.
                        </div>

                        <div th:if="${searchPerformed and !#lists.isEmpty(results)}" class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Alert ID</th>
                                        <th>TSP</th>
                                        <th>Type</th>
                                        <th>State</th>
                                        <th>Status</th>
                                        <th>Detection Time</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="record : ${results}">
                                        <td>
                                            <a th:href="@{/alert/{id}(id=${record.alertId})}" th:text="${record.alertId}">Alert</a>
                                        </td>
                                        <td th:text="${record.tsp}">TSP</td>
                                        <td>
                                            <small class="badge bg-danger" th:text="${record.discrepancyType}">Type</small>
                                        </td>
                                        <td th:text="${record.state}">State</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${record.status == 'OPEN' ? 'bg-danger' : 
                                                                   record.status == 'ACKNOWLEDGED' ? 'bg-warning' : 
                                                                   record.status == 'RESOLVED' ? 'bg-success' : 'bg-secondary'}"
                                                  th:text="${record.status}">Status</span>
                                        </td>
                                        <td th:text="${#temporals.format(record.detectionTime, 'dd-MM-yyyy HH:mm')}">Time</td>
                                        <td>
                                            <a th:href="@{/discrepancy/{id}(id=${record.id})}" class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-eye"></i> View
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
